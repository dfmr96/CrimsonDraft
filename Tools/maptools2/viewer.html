<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MapTools — Visor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/pinner.css">
<style>
  /* Hide editing hint */
  #hint { display: none !important; }
  /* Viewer topbar is simpler */
  .viewer-badge {
    font-size: 9px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: #7aaad0;
    background: rgba(74,108,150,.15);
    border: 1px solid rgba(74,108,150,.3);
    border-radius: 3px;
    padding: 2px 8px;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
  }
  /* Ocultar coords en viewer */
  #coords { display: none !important; }
  /* Pantalla de carga */
  #viewer-loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    z-index: 2000;
  }
  #viewer-loading.hidden { display: none; }
  .vl-logo {
    font-family: 'Courier New', monospace;
    font-size: 20px; font-weight: 700;
    letter-spacing: .2em; color: var(--text);
  }
  .vl-sub {
    font-size: 10px; letter-spacing: .18em;
    color: var(--muted); text-transform: uppercase;
  }
  .vl-spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: #7aaad0;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Pantalla de error (sin main_save) */
  #viewer-error {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px;
    z-index: 2000;
  }
  #viewer-error.hidden { display: none; }
  .ve-logo {
    font-family: 'Courier New', monospace;
    font-size: 20px; font-weight: 700;
    letter-spacing: .2em; color: var(--text);
  }
  .ve-msg {
    font-size: 11px; color: var(--muted);
    letter-spacing: .05em; text-align: center; line-height: 1.8;
  }
  .ve-msg code {
    font-family: 'Courier New', monospace;
    color: var(--accent2);
    background: var(--accent-bg);
    padding: 1px 6px; border-radius: 3px;
  }
  .ve-back {
    font-size: 11px; color: #7aaad0;
    background: rgba(74,108,150,.12);
    border: 1px solid rgba(74,108,150,.3);
    border-radius: 4px;
    padding: 7px 18px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    letter-spacing: .08em;
    transition: background .2s;
  }
  .ve-back:hover { background: rgba(74,108,150,.22); }
</style>
</head>
<body>

<!-- PANTALLA DE CARGA -->
<div id="viewer-loading">
  <div class="vl-logo">// MapTools</div>
  <div class="vl-sub">Loading map...</div>
  <div class="vl-spinner"></div>
</div>

<!-- PANTALLA DE ERROR (no hay main_save.json) -->
<div id="viewer-error" class="hidden">
  <div class="ve-logo">// MapTools</div>
  <div class="ve-msg">
    <code>main_save.json</code> not found in the server folder.<br>
    Export a project from the editor and name it <code>main_save.json</code>.
  </div>
  <button class="ve-back" onclick="window.location.href='/'">← Back to Editor</button>
</div>

<!-- APP SHELL (viewer) -->
<div id="app-shell" style="display:none;flex-direction:column;height:100vh;overflow:hidden">

<!-- TOPBAR simplificado -->
<div id="topbar">
  <span class="app-logo">// MapTools</span>
  <span class="viewer-badge">read-only</span>
  <div class="vsep"></div>
  <span class="project-name" id="viewer-project-name" style="font-size:11px;color:var(--muted);letter-spacing:.05em"></span>

  <div class="vsep"></div>
  <div class="mode-switcher">
    <button class="btn-mode active" id="btn-viewer-pins">Pins</button>
    <button class="btn-mode" id="btn-viewer-steps">Steps</button>
  </div>

  <!-- Derecha -->
  <div class="topbar-right">
    <span class="pin-count" id="pin-count">0 pins</span>
    <div class="vsep"></div>
    <button class="tbtn" onclick="window.location.href='/'" style="font-size:10px;opacity:.6">← Editor</button>
  </div>
</div>

<!-- MAIN -->
<div id="main">

  <!-- CANVAS AREA -->
  <div id="cwrap">
    <div id="map-container" style="position:absolute;inset:0;pointer-events:none"></div>
    <canvas id="canvas"></canvas>
    <div id="hint">.</div>
    <div id="coords">0.00 m, 0.00 m</div>
  </div>

  <!-- PANEL PINNER (izquierdo, no se usa en viewer) -->
  <div id="pinner-panel" class="hidden"></div>

  <!-- PANEL LAYERS (no se usa en viewer) -->
  <div id="layers-panel" class="hidden"></div>

  <!-- PANEL FILTROS pinner (derecho, colapsable) -->
  <div id="pinner-right" style="display:flex">
    <div class="pr-header">
      <h3>// MapViewer</h3>
      <button class="btn-toggle-pr" id="btn-toggle-pr">◀</button>
    </div>

    <!-- Barra de búsqueda -->
    <div class="search-section">
      <div class="search-wrap">
        <input type="text" id="pin-search-input" class="pin-search-input" placeholder="Search pins...">
        <button class="pin-search-clear" id="pin-search-clear" style="display:none">✕</button>
      </div>
      <div class="search-results" id="search-results" style="display:none"></div>
    </div>

    <div class="filters-section">
      <div class="filters-section-header">
        <span class="filters-title">Filters</span>
        <div class="filters-global-inline">
          <button class="btn-filter-global" id="btn-filter-all">All</button>
          <button class="btn-filter-global" id="btn-filter-none">None</button>
        </div>
      </div>
      <div id="filters-categories"></div>
    </div>
  </div>
  <button class="btn-show-pr hidden" id="btn-show-pr">◀</button>

</div><!-- /main -->

</div><!-- /app-shell -->

<!-- MODAL lectura de pin (sin botones de editar/eliminar/ocultar) -->
<div id="pin-modal">
  <div class="pin-modal-box">
    <div class="pin-modal-header">
      <span class="pin-modal-icon" id="modal-pin-icon"></span>
      <span class="pin-modal-title" id="modal-pin-title"></span>
    </div>
    <span class="pin-modal-tag" id="modal-pin-tag"></span>
    <p class="pin-modal-desc" id="modal-pin-desc"></p>

    <div class="modal-images" id="modal-images">
      <img id="modal-pin-img-0" src="" style="display:none;max-width:100%;border-radius:4px;margin-top:8px">
      <img id="modal-pin-img-1" src="" style="display:none;max-width:100%;border-radius:4px;margin-top:6px">
    </div>

    <div class="modal-relations" id="modal-requirements" style="display:none">
      <div class="modal-relations-label">Requires</div>
      <div class="modal-relations-list" id="modal-req-list"></div>
    </div>

    <div class="modal-relations" id="modal-used-in" style="display:none">
      <div class="modal-relations-label">Used in</div>
      <div class="modal-relations-list" id="modal-usedin-list"></div>
    </div>

    <div class="pin-modal-footer">
      <div class="pin-modal-actions">
        <button class="btn-pin-action" id="btn-modal-hide">Hide</button>
      </div>
      <button class="btn-pin-close" id="btn-modal-close">Close</button>
    </div>
  </div>
</div>

<!-- Modales de creación/edición: NO incluidos en viewer -->

<div class="toast" id="toast"></div>

<script src="js/map-render.js"></script>
<script src="js/project.js"></script>
<script src="js/editor.js"></script>
<script src="js/viewer-pinner.js"></script>
<script src="js/viewer-steps.js"></script>
<script src="js/viewer-app.js"></script>
</body>
</html>
